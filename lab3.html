<!DOCTYPE html>
<html>
<head>
    <title>Cultural Festival Registration</title>
</head>

<body>

    <h1>Cultural Festival 2026</h1>
    <h2>Participant Registration Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>Email:</label>
        <input type="text" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="text" name="phone">
        <br><br>

        <label>Institute Name:</label>
        <input type="text" name="institute">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
        <br><br>

        <label>Select Event:</label>
        <select name="event">
            <option value="">-- Select Event --</option>
            <option value="dance">Dance</option>
            <option value="singing">Singing</option>
            <option value="drawing">Drawing</option>
            <option value="quiz">Quiz</option>
            <option value="drama">Drama</option>
        </select>
        <br><br>

        <label>Other Interests:</label>
        <br>

        <input type="checkbox" name="interest" value="music">
        Music

        <input type="checkbox" name="interest" value="dance">
        Dance

        <input type="checkbox" name="interest" value="art">
        Art

        <input type="checkbox" name="interest" value="literature">
        Literature

        <br><br>

        <label>Why do you want to participate?</label>
        <br>

        <textarea name="message" rows="5" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
